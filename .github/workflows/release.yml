# Release nach SemVer (Freigabe Nick 23.10.2026, _kanon/freigaben.md „Lintelly HR“): steht auf main eine neue Version in
# packages/mcp/package.json, laufen Tests und Bau, dann Tag und GitHub-Release (Datei für hr.lintelly.com), npm, ghcr.io und,
# wenn eingerichtet, das MCP Registry. hr.lintelly.com holt sich das Release selbst (ops/ausrollen.sh, alle 10 Minuten).
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: release, cancel-in-progress: false }
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      neu: ${{ steps.v.outputs.neu }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: v
        run: |
          v=$(node -p "require('./packages/mcp/package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$v" >/dev/null 2>&1; then echo "neu=false" >> "$GITHUB_OUTPUT"; else echo "neu=true" >> "$GITHUB_OUTPUT"; fi
  release:
    needs: version
    if: needs.version.outputs.neu == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, registry-url: "https://registry.npmjs.org" }
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Rauchtest
        env: { RAUCHTEST_USER_AGENT: lintelly-rauchtest }
        run: |
          node packages/mcp/dist/lintelly-hr-mcp-server.mjs --http --port 8787 &
          sleep 2
          node scripts/rauchtest.mjs http://127.0.0.1:8787/mcp
      - name: Tag und GitHub-Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cd packages/mcp/dist
          sha256sum lintelly-hr-mcp-server.mjs > lintelly-hr-mcp-server.mjs.sha256
          cd -
          awk "/^## $V/{f=1;next} /^## /{f=0} f" CHANGELOG.md > notizen.md
          # Beim erneuten Lauf (z. B. nach einem npm-Fehler) gibt es das Release schon.
          gh release view "v$V" > /dev/null 2>&1 || gh release create "v$V" packages/mcp/dist/lintelly-hr-mcp-server.mjs packages/mcp/dist/lintelly-hr-mcp-server.mjs.sha256 \
            --title "Lintelly HR $V" --notes-file notizen.md --target "$GITHUB_SHA"
      - name: npm
        # Ein npm-Fehler hält Docker und Registry nicht auf; das Registry lehnt eine fehlende npm-Version selbst ab.
        continue-on-error: true
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
        # Mit Trusted Publishing auf npm (OIDC aus GitHub Actions, ab npm 11.5.1) braucht es kein Token mehr; solange gilt NPM_TOKEN.
        run: |
          npm install -g npm@11 > /dev/null
          cp LICENSE README.md packages/mcp/
          npm view "@lintelly/hr-deutschland@$V" version > /dev/null 2>&1 && { echo "npm hat $V schon"; exit 0; }
          npm publish -w @lintelly/hr-deutschland --access public --provenance
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/nicksadvisory/lintelly-hr-deutschland:${{ env.V }},ghcr.io/nicksadvisory/lintelly-hr-deutschland:latest
      # mcp-publisher fest auf eine Version und deren Prüfsumme (aus registry_1.8.1_checksums.txt und der GitHub-API, 29.10.2026).
      # Laden und Prüfen ohne Schlüssel; erst der nächste Schritt bekommt MCP_REGISTRY_KEY. Neue Version: beide Werte zusammen ändern.
      - name: mcp-publisher laden und Prüfsumme prüfen
        if: vars.MCP_REGISTRY == 'true'
        env:
          PUBLISHER_VERSION: v1.8.1
          PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -sfL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/$PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: MCP Registry (nur bestehender Eintrag, die erste Einreichung macht Nick)
        if: vars.MCP_REGISTRY == 'true'
        env: { SCHLUESSEL: "${{ secrets.MCP_REGISTRY_KEY }}" }
        run: |
          ./mcp-publisher login dns --domain lintelly.com --private-key "$SCHLUESSEL"
          ./mcp-publisher publish
